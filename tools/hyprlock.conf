# Milk Outside A Bag Of Milk — hyprlock (v0.9.x syntax)
# red room art behind, Retro Gaming font, milk-red text

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/qed/Projects/hyprmilk/assets/bg/walls/balcony.png
    color = rgba(10, 8, 12, 0.62)
    blur_passes = 2
    contrast = 1
    brightness = 0.55
    vibrancy = 0.25
    vibrancy_darkness = 0.3
}

# TIME — top center, hard red
label {
    monitor =
    text = $TIME
    font_family = Retro Gaming
    font_size = 80
    color = rgba(172, 50, 50, 1.0)   # #ac3232
    position = 0, -200
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(5, 5, 8, 0.9)
}

# DATE — under the clock
label {
    monitor =
    text = cmd[update:60000] date +'%A %d %B'
    font_family = Retro Gaming
    font_size = 24
    color = rgba(172, 50, 50, 0.85)
    position = 0, -330
    halign = center
    valign = top
}

# HINT
label {
    monitor =
    text = type to unlock
    font_family = Retro Gaming
    font_size = 18
    color = rgba(140, 43, 43, 0.9)   # #8c2b2b
    position = 0, -40
    halign = center
    valign = bottom
}

# INPUT FIELD — restored to the original pre-theme block (0.9.6-safe)
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    font_color = rgb(172, 50, 50)         # milk red (dots_color removed in 0.9.6)
    outer_color = rgba(172, 50, 50, 1.0)  # red border
    inner_color = rgba(0, 0, 0, 0)
    check_color = rgb(172, 50, 50)
    fade_on_empty = true
    rounding = 0                          # sharp pixel corners
    placeholder_text =
    font_family = Starzoom Shavian Italic  # original field font
    hide_input = false                     # original: typed password shows as text
    position = 0, -160
    halign = center
    valign = center
    capslock_color = rgb(226, 60, 60)
}
